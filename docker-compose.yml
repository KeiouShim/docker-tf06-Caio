version: '3.8'

services:
  web:
    build: ./nginx
    container_name: web_server
    ports:
      - "8080:80"
    networks:
      - lab_network
    depends_on:
      - cache

  cache:
    image: redis:alpine
    container_name: redis_cache
    volumes:
      - redis_data:/data
    networks:
      - lab_network

networks:
  lab_network:
    driver: bridge

volumes:
  redis_data: